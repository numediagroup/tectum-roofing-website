# Netlify config — static site, no build step.
# The whole repo root is the site; index.html is served as-is.
[build]
  publish = "."
  command = ""

# Long-cache the fingerprint-safe static assets (fonts/images).
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# The repo root is the publish directory, so the internal notes were being
# served as public pages — /PLACEHOLDERS.md returned 200 on the live site.
# Keep the docs in the repo, off the web.
#
# NOTE: these must be listed one by one. Netlify only supports a splat at the
# END of a path, so "/*.md" matches nothing and fails silently. If you add
# another markdown file at the repo root, add a rule for it here too.
[[redirects]]
  from = "/PLACEHOLDERS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
